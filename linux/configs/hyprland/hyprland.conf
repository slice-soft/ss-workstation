# SliceSoft — Hyprland config (compartida / portable)
#
# Lo específico de TU máquina (monitores, GPU NVIDIA, workspaces por monitor)
# NO va aquí — va en ~/.config/hypr/local.conf (no versionado).
# El instalador crea ese archivo desde local.conf.example si no existe.

autogenerated = 0

# ─── Entorno (universal) ─────────────────────────────────────────────────────
env = XDG_SESSION_TYPE,wayland
env = GDK_SCALE,1

# ─── Overrides de máquina (monitores, GPU, workspaces por monitor) ───────────
source = ~/.config/hypr/local.conf

# ─── Variables ───────────────────────────────────────────────────────────────
$mainMod      = SUPER
$mainModShift = SUPER SHIFT
$terminal     = kitty
$fileManager  = dolphin
$menu         = rofi -show drun
$screenshot   = ~/.config/hypr/scripts/screenshot.sh

# ─── General ─────────────────────────────────────────────────────────────────
general {
    gaps_in  = 2
    gaps_out = 4
}

# ─── Autostart ───────────────────────────────────────────────────────────────
# Bajo uwsm ("Hyprland (uwsm-managed)" en el login): finalize exporta
# WAYLAND_DISPLAY / HYPRLAND_INSTANCE_SIGNATURE al gestor de usuario de systemd
# y da por alcanzado graphical-session.target, que es quien arranca waybar.service
# (con Restart=on-failure, así la barra revive si se cae o tras una actualización).
#
# Si la sesión NO es uwsm, finalize sale con error y se lanza waybar a pelo:
# la config sigue siendo válida en máquinas que arranquen Hyprland de forma clásica.
exec-once = uwsm finalize || waybar

# ─── Apps ────────────────────────────────────────────────────────────────────
bind = $mainMod,      Q, exec,          $terminal
bind = $mainMod,      C, killactive,
bind = $mainMod,      M, exec,          command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod,      E, exec,          $fileManager
bind = $mainMod,      V, togglefloating,
bind = $mainMod,      R, exec,          $menu
bind = $mainMod,      F, fullscreen,

# ─── Foco entre ventanas (vim-style + flechas) ───────────────────────────────
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# ─── Screenshots (grim + slurp + satty) ──────────────────────────────────────
# Print y sus modificadores, que es la convención en Linux. El equivalente
# literal de macOS (SUPER+SHIFT+3/4/5) no se usa aquí porque esas combinaciones
# ya mueven ventanas a los workspaces 3, 4 y 5.
#
#   Print          → seleccionar región     (≈ Cmd+Shift+4 en macOS)
#   SHIFT + Print  → monitor completo       (≈ Cmd+Shift+3)
#   CTRL  + Print  → región y luego anotar  (≈ Cmd+Shift+5)
#   ALT   + Print  → la ventana enfocada
#
# Todas guardan en <Imágenes>/Capturas *y* copian al portapapeles.
bind = ,              Print, exec, $screenshot region
bind = SHIFT,         Print, exec, $screenshot full
bind = CTRL,          Print, exec, $screenshot edit
bind = ALT,           Print, exec, $screenshot window
bind = $mainModShift, S,     exec, $screenshot region

# ─── Volumen (wireplumber) ───────────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute  @DEFAULT_AUDIO_SINK@ toggle

# ─── Multimedia (playerctl) ──────────────────────────────────────────────────
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous

# ─── Brillo (brightnessctl) ──────────────────────────────────────────────────
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 10%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-

# ─── Workspaces ──────────────────────────────────────────────────────────────
bind = $mainMod,      1, workspace, 1
bind = $mainMod,      2, workspace, 2
bind = $mainMod,      3, workspace, 3
bind = $mainMod,      4, workspace, 4
bind = $mainMod,      5, workspace, 5
bind = $mainMod,      6, workspace, 6
bind = $mainMod,      7, workspace, 7
bind = $mainMod,      8, workspace, 8
bind = $mainMod,      9, workspace, 9

bind = $mainModShift, 1, movetoworkspace, 1
bind = $mainModShift, 2, movetoworkspace, 2
bind = $mainModShift, 3, movetoworkspace, 3
bind = $mainModShift, 4, movetoworkspace, 4
bind = $mainModShift, 5, movetoworkspace, 5
bind = $mainModShift, 6, movetoworkspace, 6
bind = $mainModShift, 7, movetoworkspace, 7
bind = $mainModShift, 8, movetoworkspace, 8
bind = $mainModShift, 9, movetoworkspace, 9
