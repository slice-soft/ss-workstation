# SliceSoft — ajustes sobre el waybar.service que trae el paquete.
#
# El unit de upstream ya vale (Restart=on-failure, WantedBy=graphical-session.target);
# esto añade lo que recomienda uwsm en /usr/share/doc/uwsm/example-units/:
#   · Type=exec        — systemd considera arrancado el servicio al hacer exec,
#                        no al hacer fork, así Restart= cuenta bien los fallos.
#   · ExecCondition    — no arranca la barra si la sesión no es un compositor
#                        soportado (evita units zombis en sesiones GNOME/KDE).
#   · Slice=           — la mete en la slice gráfica, junto al resto de la sesión.
[Service]
Type=exec
ExecCondition=/usr/lib/systemd/systemd-xdg-autostart-condition "wlroots:sway:Wayfire:labwc:Hyprland" ""
Slice=app-graphical.slice
